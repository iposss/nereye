<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nereye — Atık Arama</title>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #ffffff;
    color: #111111;
    padding: 0;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: #D4D5FF;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    font-size: 16px;
    font-family: 'Bree Serif', serif;
    letter-spacing: 0.1em;
    color: #111111;
    text-decoration: none;
  }

  .nav-back {
    font-size: 22px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    color: #111111;
    text-decoration: none;
    opacity: 0.5;
    transition: opacity 0.15s;
    line-height: 1;
  }

  .nav-back:hover { opacity: 1; }

  .content {
    padding: 32px 24px 60px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-row input,
  .search-row select {
    height: 44px;
    border: 1.5px solid #111111;
    border-radius: 22px;
    padding: 0 16px;
    font-size: 14px;
    background: #ffffff;
    color: #111111;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-row input { flex: 1; min-width: 200px; }
  .search-row select { min-width: 160px; }
  .search-row input:focus,
  .search-row select:focus { border-color: #1A3A2A; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .chip {
    font-size: 13px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid #111111;
    cursor: pointer;
    background: #ffffff;
    color: #111111;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover { background: #f0f0f0; }
  .chip.active {
    background: #1A3A2A;
    color: #C8D5A0;
    border-color: #1A3A2A;
  }

  .results-meta {
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    border: 1.5px solid #e0e0e0;
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    background: #ffffff;
  }

  .card:hover {
    border-color: #1A3A2A;
    transform: translateY(-1px);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    color: #111111;
    line-height: 1.3;
  }

  .card-district {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    background: #D4D5FF;
  }

  .card-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f0f0f0;
    color: #444;
  }

  .tag.electronics { background: #E6F1FB; color: #0C447C; }
  .tag.textile { background: #D4D5FF; color: #26215C; }
  .tag.furniture { background: #FAEEDA; color: #633806; }
  .tag.hazardous { background: #FCEBEB; color: #791F1F; }
  .tag.recyclable { background: #C8D5A0; color: #1A3A2A; }
  .tag.organic { background: #E1F5EE; color: #085041; }
  .tag.bulky { background: #f0f0f0; color: #444441; }

  .detail {
    border: 1.5px solid #1A3A2A;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    background: #ffffff;
  }

  .detail-back {
    font-size: 13px;
    color: #666;
    cursor: pointer;
    margin-bottom: 16px;
    display: inline-block;
  }
  .detail-back:hover { color: #111; }

  .detail-title { font-size: 22px; font-family: 'Bree Serif', serif; margin-bottom: 4px; }
  .detail-district { font-size: 14px; color: #666; margin-bottom: 20px; }

  .detail-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .detail-label { color: #666; min-width: 80px; }
  .detail-value { color: #111; }

  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }

  .note-box {
    background: #C8D5A0;
    color: #1A3A2A;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 16px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 15px;
    grid-column: 1 / -1;
  }

  .empty strong {
    display: block;
    font-size: 18px;
    color: #111;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="https://nereye.framer.website" class="nav-logo">NEREYE</a>
  <a href="https://nereye.framer.website" class="nav-back">←</a>
</nav>

<div style="background:#FAEEDA;color:#633806;font-size:12px;font-family:'Nunito',sans-serif;font-weight:700;text-align:center;padding:8px 16px;letter-spacing:0.03em;">Beta — veriler güncellenmektedir</div>

<div class="content">

<div class="search-row">
  <input type="text" id="searchInput" placeholder="İlçe veya nokta ara..." oninput="render()" />
  <select id="districtSelect" onchange="render()">
    <option value="">Tüm ilçeler</option>
  </select>
</div>

<div class="filters" id="filterChips"></div>
<div class="results-meta" id="resultsMeta"></div>
<div id="detailPanel" style="display:none;"></div>
<div class="grid" id="grid"></div>

</div>

<script>
const CATS = [
  { id: "all", label: "Tümü" },
  { id: "electronics", label: "Elektronik" },
  { id: "textile", label: "Tekstil" },
  { id: "furniture", label: "Mobilya" },
  { id: "hazardous", label: "Tehlikeli atık" },
  { id: "recyclable", label: "Geri dönüşüm" },
  { id: "organic", label: "Organik" },
  { id: "bulky", label: "Büyük eşya" },
];

const ICONS = {
  electronics: "💻", textile: "👕", furniture: "🪑",
  hazardous: "⚠️", recyclable: "♻️", organic: "🌱", bulky: "📦"
};

const DATA = [
  { id:1, name:"Kadıköy 1. Sınıf Atık Getirme Merkezi", district:"Kadıköy", address:"Hasanpaşa Mah. — Kadıköy Belediyesi Bahçesi", hours:"Pzt–Cum 08:30–17:00, Cts 09:00–16:00", open:true, cats:["recyclable","electronics","textile","organic","hazardous"], note:"14 farklı atık türü kabul edilir: elektronik, tekstil, organik, tehlikeli atık, pil, ilaç ve daha fazlası. Kaynak: Kadıköy Belediyesi." },
  { id:2, name:"Kadıköy Tekstil Bağış Birimi", district:"Kadıköy", address:"Eğitim Mah. Ahsen Çıkmazı Sok. Sadıkoğlu Plaza 4 No:2/3", hours:"Pzt–Cum 09:00–17:00", open:true, cats:["textile"], note:"Kullanılabilir durumdaki kıyafet ve tekstil ürünleri ihtiyaç sahiplerine ulaştırılıyor. Kaynak: Kadıköy Belediyesi." },
  { id:3, name:"Dolmabahçe Hizmet Birimi (İBB)", district:"Beşiktaş", address:"Vişnezade Mah. Kadırgalar Cad. No:53", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","electronics"], note:"İBB'ye bağlı şehir temizliği hizmet birimi. Geri dönüşüm ve elektronik atık kabul edilir. Kaynak: İBB." },
  { id:4, name:"Üsküdar Atık Yönetimi Birimi", district:"Üsküdar", address:"Mimar Sinan Mah. Çavuşdere Cad. No:35 — Üsküdar Belediyesi Hizmet Binası", hours:"Salı–Cum 09:00–17:00", open:true, cats:["recyclable","textile","electronics"], note:"Dönüşümde Üsküdar Modeli kapsamında hizmet verir. Toplanan atık geliriyle sosyal yardım yapılıyor. Kaynak: Üsküdar Belediyesi." },
  { id:5, name:"Baruthane Katı Atık Aktarma İstasyonu (İBB)", district:"Şişli", address:"Paşa Mah. Piyalepaşa Bulvarı No:74", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","bulky"], note:"İBB'ye bağlı aktarma istasyonu. Büyük eşya ve geri dönüşüm atıkları kabul edilir. Kaynak: İBB." },
  { id:6, name:"Maltepe Atık Getirme Merkezi", district:"Maltepe", address:"Feyzullah Mah. Plaj Yolu No:1", hours:"Pzt–Cts 08:00–18:00", open:true, cats:["recyclable","electronics","textile"], note:"Hilltown AVM ve Piazza AVM'de de bırakma noktaları mevcut. Kaynak: Maltepe Belediyesi." },
  { id:7, name:"Elektronik Atık İşleme ve Geri Kazanım Tesisi (İBB)", district:"Bahçelievler", address:"Çobançeşme Mah. Sanayi Cad. Yenibosna", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["electronics"], note:"İBB'nin resmi elektronik atık işleme tesisi. Telefon, bilgisayar, kablo, pil ve küçük ev aletleri kabul edilir. Kaynak: İBB." },
  { id:8, name:"Gaziosmanpaşa 1. Sınıf Atık Getirme Merkezi", district:"Gaziosmanpaşa", address:"Karayolları Mah. 568. Sok. No:17", hours:"Pzt–Cts 08:00–17:00", open:true, cats:["recyclable","electronics","textile","hazardous"], note:"22 farklı tehlikeli ve tehlikesiz atık türü kabul edilir. Kaynak: Gaziosmanpaşa Belediyesi." },
  { id:9, name:"Edirnekapı Hizmet Birimi (İBB)", district:"Eyüpsultan", address:"Topçular Mah. Bostan Aralığı Sk. — Edirnekapı İETT Garajı Yanı", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","bulky"], note:"İBB şehir temizliği hizmet birimi. Geri dönüşüm ve büyük eşya kabul edilir. Kaynak: İBB." },
  { id:10, name:"Maltepe Hizmet Birimi (İSTAÇ)", district:"Maltepe", address:"Zümrütevler, Adatepe Cad. No:60", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","bulky","electronics"], note:"İSTAÇ'a bağlı hizmet birimi. Çok kategorili atık kabul eder. Kaynak: İSTAÇ." },
  { id:11, name:"Bakkalköy Katı Atık Aktarma İstasyonu (İSTAÇ)", district:"Ataşehir", address:"Küçükbakkalköy Mah. Prof. Dr. Hıfzı Özcan Cad.", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","bulky"], note:"İSTAÇ'a bağlı Anadolu Yakası aktarma istasyonu. Kaynak: İSTAÇ." },
  { id:12, name:"Ümraniye Hizmet Birimi (İSTAÇ)", district:"Ümraniye", address:"Hekimbaşı Mah. Küçüksu Cad. Asfalt Sok.", hours:"Pzt–Cum 08:00–17:00", open:true, cats:["recyclable","electronics"], note:"İSTAÇ'a bağlı hizmet birimi. Geri dönüşüm ve elektronik atık kabul edilir. Kaynak: İSTAÇ." },
];

let activeFilter = "all";
let activeDetail = null;

function buildDistricts() {
  const sel = document.getElementById("districtSelect");
  [...new Set(DATA.map(d => d.district))].sort().forEach(d => {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
}

function buildChips() {
  document.getElementById("filterChips").innerHTML = CATS.map(c =>
    `<div class="chip${activeFilter === c.id ? ' active' : ''}" onclick="setFilter('${c.id}')">${c.label}</div>`
  ).join("");
}

function setFilter(f) {
  activeFilter = f;
  activeDetail = null;
  document.getElementById("detailPanel").style.display = "none";
  buildChips();
  render();
}

function getFiltered() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const dist = document.getElementById("districtSelect").value;
  return DATA.filter(loc => {
    const matchCat = activeFilter === "all" || loc.cats.includes(activeFilter);
    const matchQ = !q || loc.name.toLowerCase().includes(q) || loc.district.toLowerCase().includes(q);
    const matchDist = !dist || loc.district === dist;
    return matchCat && matchQ && matchDist;
  });
}

function showDetail(id) {
  const loc = DATA.find(d => d.id === id);
  activeDetail = id;
  const dot = loc.open ? "#1A3A2A" : "#E24B4A";
  const status = loc.open ? "Şu an açık" : "Şu an kapalı";
  const panel = document.getElementById("detailPanel");
  panel.innerHTML = `
    <div class="detail">
      <span class="detail-back" onclick="closeDetail()">← Listeye dön</span>
      <div class="detail-title">${loc.name}</div>
      <div class="detail-district">${loc.district}</div>
      <div class="detail-row"><span class="detail-label">Adres</span><span class="detail-value">${loc.address}</span></div>
      <div class="detail-row"><span class="detail-label">Saatler</span><span class="detail-value">${loc.hours}</span></div>
      <div class="detail-tags">${loc.cats.map(c => `<span class="tag ${c}">${ICONS[c]} ${CATS.find(x=>x.id===c)?.label || c}</span>`).join("")}</div>
      <div class="note-box">${loc.note}</div>
    </div>
  `;
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeDetail() {
  activeDetail = null;
  document.getElementById("detailPanel").style.display = "none";
}

function render() {
  const filtered = getFiltered();
  document.getElementById("resultsMeta").textContent = `${filtered.length} nokta bulundu`;
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><strong>Sonuç bulunamadı</strong>Farklı bir filtre veya ilçe deneyin.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(loc => {
    const primary = loc.cats[0];
    return `<div class="card" onclick="showDetail(${loc.id})">
      <div class="card-top">
        <div>
          <div class="card-name">${loc.name}</div>
          <div class="card-district">${loc.district}</div>
        </div>
        <div class="card-icon">${ICONS[primary] || "📍"}</div>
      </div>
      <div class="card-status">${loc.hours}</div>
      <div class="card-tags">${loc.cats.map(c => `<span class="tag ${c}">${CATS.find(x=>x.id===c)?.label || c}</span>`).join("")}</div>
    </div>`;
  }).join("");
}

buildDistricts();
buildChips();
render();
</script>
</body>
</html>
