<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nereye — Atık Arama</title>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #ffffff;
    color: #111111;
    padding: 0;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: #D4D5FF;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    font-size: 16px;
    font-family: 'Bree Serif', serif;
    letter-spacing: 0.1em;
    color: #111111;
    text-decoration: none;
  }

  .nav-back {
    font-size: 22px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    color: #111111;
    text-decoration: none;
    opacity: 0.5;
    transition: opacity 0.15s;
    line-height: 1;
  }

  .nav-back:hover { opacity: 1; }

  .content {
    padding: 32px 24px 60px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-row input,
  .search-row select {
    height: 44px;
    border: 1.5px solid #111111;
    border-radius: 22px;
    padding: 0 16px;
    font-size: 14px;
    background: #ffffff;
    color: #111111;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-row input { flex: 1; min-width: 200px; }
  .search-row select { min-width: 160px; }
  .search-row input:focus,
  .search-row select:focus { border-color: #1A3A2A; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .chip {
    font-size: 13px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid #111111;
    cursor: pointer;
    background: #ffffff;
    color: #111111;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover { background: #f0f0f0; }
  .chip.active {
    background: #1A3A2A;
    color: #C8D5A0;
    border-color: #1A3A2A;
  }

  .results-meta {
    font-size: 13px;
    color: #666;
    margin-bottom: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    border: 1.5px solid #e0e0e0;
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    background: #ffffff;
  }

  .card:hover {
    border-color: #1A3A2A;
    transform: translateY(-1px);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    color: #111111;
    line-height: 1.3;
  }

  .card-district {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    background: #D4D5FF;
  }

  .card-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f0f0f0;
    color: #444;
  }

  .tag.electronics { background: #E6F1FB; color: #0C447C; }
  .tag.textile { background: #D4D5FF; color: #26215C; }
  .tag.furniture { background: #FAEEDA; color: #633806; }
  .tag.hazardous { background: #FCEBEB; color: #791F1F; }
  .tag.recyclable { background: #C8D5A0; color: #1A3A2A; }
  .tag.organic { background: #E1F5EE; color: #085041; }
  .tag.bulky { background: #f0f0f0; color: #444441; }

  .detail {
    border: 1.5px solid #1A3A2A;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    background: #ffffff;
  }

  .detail-back {
    font-size: 13px;
    color: #666;
    cursor: pointer;
    margin-bottom: 16px;
    display: inline-block;
  }
  .detail-back:hover { color: #111; }

  .detail-title { font-size: 22px; font-family: 'Bree Serif', serif; margin-bottom: 4px; }
  .detail-district { font-size: 14px; color: #666; margin-bottom: 20px; }

  .detail-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .detail-label { color: #666; min-width: 80px; }
  .detail-value { color: #111; }

  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }

  .note-box {
    background: #C8D5A0;
    color: #1A3A2A;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 16px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 15px;
    grid-column: 1 / -1;
  }

  .empty strong {
    display: block;
    font-size: 18px;
    color: #111;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="https://nereye.framer.website" class="nav-logo">NEREYE</a>
  <a href="https://nereye.framer.website" class="nav-back">←</a>
</nav>

<div class="content">

<div class="search-row">
  <input type="text" id="searchInput" placeholder="İlçe veya nokta ara..." oninput="render()" />
  <select id="districtSelect" onchange="render()">
    <option value="">Tüm ilçeler</option>
  </select>
</div>

<div class="filters" id="filterChips"></div>
<div class="results-meta" id="resultsMeta"></div>
<div id="detailPanel" style="display:none;"></div>
<div class="grid" id="grid"></div>

</div>

<script>
const CATS = [
  { id: "all", label: "Tümü" },
  { id: "electronics", label: "Elektronik" },
  { id: "textile", label: "Tekstil" },
  { id: "furniture", label: "Mobilya" },
  { id: "hazardous", label: "Tehlikeli atık" },
  { id: "recyclable", label: "Geri dönüşüm" },
  { id: "organic", label: "Organik" },
  { id: "bulky", label: "Büyük eşya" },
];

const ICONS = {
  electronics: "💻", textile: "👕", furniture: "🪑",
  hazardous: "⚠️", recyclable: "♻️", organic: "🌱", bulky: "📦"
};

const DATA = [
  { id:1, name:"Kadıköy Geri Dönüşüm Merkezi", district:"Kadıköy", address:"Moda Cad. No:12, Kadıköy", hours:"Pzt–Cts 08:00–18:00", open:true, cats:["recyclable","electronics","textile"], note:"Ayrıştırılmış geri dönüşüm ve küçük e-atık kabul edilir. Torba dağıtımı yapılır." },
  { id:2, name:"Beşiktaş Elektronik Atık Noktası", district:"Beşiktaş", address:"Çarşı Mah., Beşiktaş", hours:"Pzt–Cum 09:00–17:00", open:true, cats:["electronics"], note:"Telefon, laptop, kablo, pil kabul edilir. Beyaz eşya alınmaz." },
  { id:3, name:"Üsküdar Tekstil Toplama", district:"Üsküdar", address:"Ahmediye Mah., Üsküdar", hours:"Her gün 08:00–20:00", open:true, cats:["textile"], note:"Her koşuldaki kıyafet, ayakkabı ve çanta kabul edilir." },
  { id:4, name:"Ataşehir Tehlikeli Atık Deposu", district:"Ataşehir", address:"Atatürk Mah. İBB Tesisi", hours:"Çrş & Cts 10:00–16:00", open:false, cats:["hazardous"], note:"Boya, solvent, pil, floresan ampul. Randevu önerilir." },
  { id:5, name:"Şişli Büyük Eşya Toplama", district:"Şişli", address:"Mecidiyeköy Lojistik Alanı", hours:"Salı & Perşembe 07:00–13:00", open:false, cats:["bulky","furniture"], note:"Kanepe, yatak, beyaz eşya. İBB 153 ile randevu alınabilir." },
  { id:6, name:"Bakırköy Organik Kompost", district:"Bakırköy", address:"Sahil Parkı Yanı, Bakırköy", hours:"Her gün 07:00–21:00", open:true, cats:["organic"], note:"Yemek artığı ve bahçe atığı. Et ve süt ürünü kabul edilmez." },
  { id:7, name:"Maltepe Karma Atık Noktası", district:"Maltepe", address:"Bağlarbaşı Cad. 45, Maltepe", hours:"Pzt–Cts 08:00–19:00", open:true, cats:["recyclable","textile","electronics"], note:"Çok kategorili bırakma noktası. Park yeri mevcut." },
  { id:8, name:"Sarıyer Mobilya Bağış Merkezi", district:"Sarıyer", address:"Reşitpaşa Mah., Sarıyer", hours:"Pzt–Cum 10:00–17:00", open:true, cats:["furniture","bulky"], note:"Çalışan mobilya yeniden dağıtım için kabul edilir. Arızalı eşya sadece Cuma." },
  { id:9, name:"Fatih İlaç ve Kimyasal Atık", district:"Fatih", address:"Aksaray Çevre Birimi", hours:"Perşembe 09:00–14:00", open:false, cats:["hazardous"], note:"Süresi dolmuş ilaç ve temizlik kimyasalı. Orijinal kapalı ambalajda getirilmeli." },
  { id:10, name:"Pendik Geri Dönüşüm Parkı", district:"Pendik", address:"Kurtköy Organize San., Pendik", hours:"Her gün 08:00–22:00", open:true, cats:["recyclable","bulky","furniture","electronics"], note:"Anadolu yakasının en büyük çok kategorili parkı. Geri dönüşüm için 24 saat açık." },
  { id:11, name:"Kartal Elektronik Toplama", district:"Kartal", address:"Esentepe Mah., Kartal", hours:"Pzt–Cum 09:00–18:00", open:true, cats:["electronics"], note:"Küçük ev aletleri, telefon, tablet kabul edilir." },
  { id:12, name:"Beylikdüzü Tekstil Kutusu", district:"Beylikdüzü", address:"Marmara Mah. AVM Yanı", hours:"Her gün 08:00–22:00", open:true, cats:["textile"], note:"Alışveriş merkezi önünde sabit toplama kutusu." },
];

let activeFilter = "all";
let activeDetail = null;

function buildDistricts() {
  const sel = document.getElementById("districtSelect");
  [...new Set(DATA.map(d => d.district))].sort().forEach(d => {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
}

function buildChips() {
  document.getElementById("filterChips").innerHTML = CATS.map(c =>
    `<div class="chip${activeFilter === c.id ? ' active' : ''}" onclick="setFilter('${c.id}')">${c.label}</div>`
  ).join("");
}

function setFilter(f) {
  activeFilter = f;
  activeDetail = null;
  document.getElementById("detailPanel").style.display = "none";
  buildChips();
  render();
}

function getFiltered() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const dist = document.getElementById("districtSelect").value;
  return DATA.filter(loc => {
    const matchCat = activeFilter === "all" || loc.cats.includes(activeFilter);
    const matchQ = !q || loc.name.toLowerCase().includes(q) || loc.district.toLowerCase().includes(q);
    const matchDist = !dist || loc.district === dist;
    return matchCat && matchQ && matchDist;
  });
}

function showDetail(id) {
  const loc = DATA.find(d => d.id === id);
  activeDetail = id;
  const dot = loc.open ? "#1A3A2A" : "#E24B4A";
  const status = loc.open ? "Şu an açık" : "Şu an kapalı";
  const panel = document.getElementById("detailPanel");
  panel.innerHTML = `
    <div class="detail">
      <span class="detail-back" onclick="closeDetail()">← Listeye dön</span>
      <div class="detail-title">${loc.name}</div>
      <div class="detail-district">${loc.district}</div>
      <div class="detail-row"><span class="detail-label">Adres</span><span class="detail-value">${loc.address}</span></div>
      <div class="detail-row"><span class="detail-label">Saatler</span><span class="detail-value">${loc.hours}</span></div>
      <div class="detail-row"><span class="detail-label">Durum</span><span class="detail-value" style="display:flex;align-items:center;gap:6px;"><span class="dot" style="background:${dot}"></span>${status}</span></div>
      <div class="detail-tags">${loc.cats.map(c => `<span class="tag ${c}">${ICONS[c]} ${CATS.find(x=>x.id===c)?.label || c}</span>`).join("")}</div>
      <div class="note-box">${loc.note}</div>
    </div>
  `;
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeDetail() {
  activeDetail = null;
  document.getElementById("detailPanel").style.display = "none";
}

function render() {
  const filtered = getFiltered();
  document.getElementById("resultsMeta").textContent = `${filtered.length} nokta bulundu`;
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><strong>Sonuç bulunamadı</strong>Farklı bir filtre veya ilçe deneyin.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(loc => {
    const primary = loc.cats[0];
    const dot = loc.open ? "#1A3A2A" : "#E24B4A";
    const status = loc.open ? "Açık" : "Kapalı";
    return `<div class="card" onclick="showDetail(${loc.id})">
      <div class="card-top">
        <div>
          <div class="card-name">${loc.name}</div>
          <div class="card-district">${loc.district}</div>
        </div>
        <div class="card-icon">${ICONS[primary] || "📍"}</div>
      </div>
      <div class="card-status"><span class="dot" style="background:${dot}"></span>${status} · ${loc.hours.split(" ")[0]}</div>
      <div class="card-tags">${loc.cats.map(c => `<span class="tag ${c}">${CATS.find(x=>x.id===c)?.label || c}</span>`).join("")}</div>
    </div>`;
  }).join("");
}

buildDistricts();
buildChips();
render();
</script>
</body>
</html>
